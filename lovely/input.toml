[manifest]
version = "1.0.0"
dump_lua = true
priority = 3621



[[patches]]
[patches.pattern]
target = "main.lua"
pattern = '''local gameDirectory = love.filesystem.getSourceBaseDirectory()'''
position = "before"
payload = '''
jsrshf = {
    nativefs = require("Mods.jsrshf.lib.nativefs"),
    mouse = {}
}
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = '''function love.update(d)'''
position = "after"
payload = '''
jsrshf.mouse.x = mouse.dx
jsrshf.mouse.y = mouse.dy

jsrshf.mouse.down = love.mouse.isDown(1) and not jsrshf.mouse._wasDown
jsrshf.mouse.up = not love.mouse.isDown(1) and jsrshf.mouse._wasDown
jsrshf.mouse._wasDown = love.mouse.isDown(1)

jsrshf.outlineRect = jsrshf.outlineRect or function(x, y, w, h)
    color(1)
    love.graphics.rectangle('fill', x - 1, y - 1, w + 2, h + 2)
    color(0)
    love.graphics.rectangle('fill', x, y, w, h)
end

jsrshf.imgButton = jsrshf.imgButton or function(sprite, x, y, run)
    love.graphics.draw(sprite, x, y)

    local w = sprite:getWidth()
    local h = sprite:getHeight()

    local mx = mouse.rx
    local my = mouse.ry

    if jsrshf.mouse.down then
        if mx >= x and mx <= x + w and my >= y and my <= y + h then
            run()
        end
    end
end

jsrshf.average = jsrshf.average or function(arr)
    if #arr == 0 then return 0 end

    local sum = 0
    for _, value in ipairs(arr) do
        sum = sum + value
    end

    return sum / #arr
end

jsrshf.copyTable = jsrshf.copyTable or function(t)
    if type(t) ~= "table" then return t end
    local new = {}
    for k, v in pairs(t) do
        if type(v) == "table" then
            new[k] = copyTable(v)
        else
            new[k] = v
        end
    end
    return new
end

jsrshf.compareTable = jsrshf.compareTable or (a, b)
    if a == b then return true end
    if type(a) ~= "table" or type(b) ~= "table" then return false end

    for k, v in pairs(a) do
        local bv = b[k]
        if type(v) == "table" and type(bv) == "table" then
            if not compareTable(v, bv) then
                return false
            end
        elseif v ~= bv then
            return false
        end
    end

    for k in pairs(b) do
        if a[k] == nil then return false end
    end

    return true
end
'''
match_indent = true